name: Keep backend awake

on:
  schedule:
    - cron: "*/5 * * * *"     # every 5 minutes (GitHub may run it late)
  workflow_dispatch:           # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$BACKEND_URL/health") && \
              echo "Attempt $i: HTTP $code" && [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "Backend did not answer with 200"; exit 1
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}