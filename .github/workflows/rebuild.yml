name: Rebuild caches

on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: "Run IDs, comma separated, or 'all'"
        required: true
        default: "all"
        type: string

concurrency:
  group: sampark-pipeline        # never at the same time as a pipeline run
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Rebuild ready-made files
        env:
          PYTHONUNBUFFERED: "1"
          MALLOC_ARENA_MAX: "2"
          RUN_IDS: ${{ inputs.run_ids }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_USERNAME: ${{ secrets.MONGO_USERNAME }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: python -m scripts.rebuild_caches