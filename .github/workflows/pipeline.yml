name: Pipeline

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID made by the backend"
        required: true
        type: string
      request:
        description: "Run request as JSON"
        required: true
        type: string

concurrency:
  group: sampark-pipeline        # one run at a time; extra runs wait in line
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          SAMPARK_WORKER: "1"
          PYTHONUNBUFFERED: "1"
          MALLOC_ARENA_MAX: "2"
          RUN_ID: ${{ inputs.run_id }}          # passed as env, never pasted into the script
          RUN_REQUEST: ${{ inputs.request }}
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_USERNAME: ${{ secrets.MONGO_USERNAME }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: python -m scripts.run_remote