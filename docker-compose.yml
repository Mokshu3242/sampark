services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend/app:/app/app
      - ./backend/pipeline:/app/pipeline
      - ./backend/data:/app/data
      - openeo-auth:/root/.local/share/openeo-python-client

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend/src:/app/src

volumes:
  openeo-auth: